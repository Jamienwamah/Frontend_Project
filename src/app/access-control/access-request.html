<div class="access-request-page">
  <div class="access-request-card">

    <h1>{{ formName }}</h1>

    <p>
      This form is available for submission. Complete the form and submit your request.
      The appropriate department will review and approve the request.
    </p>

    <div class="actions">
      <button type="button" (click)="goToForm()">
        Continue to Form
      </button>

      <button type="button" class="secondary" (click)="goBack()">
        Back
      </button>
    </div>

  </div>
</div>
